upstream active_app {
    server unix:/run/gunicorn-active.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    server_tokens off;
    client_max_body_size 2m;

    location /static/ {
        alias /srv/active/app/staticfiles/;
        # WhiteNoise's collectstatic writes .gz copies next to each file; nginx serves them directly.
        gzip_static on;
        expires 30d;
        access_log off;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://active_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
