[project]
name = "active-d"
version = "0.1.0"
description = "Django conversion of the Active marketing site template."
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["static", "staticfiles"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM", "PT", "RUF", "ANN"]
# RUF012: Django class-based views and forms declare mutable class attributes by design.
ignore = ["ANN401", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
