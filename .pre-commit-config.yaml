repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^static/vendor/
      - id: trailing-whitespace
        exclude: ^static/vendor/
      - id: check-added-large-files
        # The template ships photos and a Bootstrap source map between 500 KB and 1 MB.
        args: [--maxkb=1024]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
